services:
  postgres:
    image: postgres:16-alpine
    container_name: ats_postgres
    environment:
      POSTGRES_DB: ats
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats_secret
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats -d ats"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ats_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://ats:ats_secret@postgres:5432/ats
      BINANCE_API_KEY: "${BINANCE_API_KEY:-}"
      BINANCE_API_SECRET: "${BINANCE_API_SECRET:-}"
      BYBIT_API_KEY: "${BYBIT_API_KEY:-}"
      BYBIT_API_SECRET: "${BYBIT_API_SECRET:-}"
      OKX_API_KEY: "${OKX_API_KEY:-}"
      OKX_API_SECRET: "${OKX_API_SECRET:-}"
      OKX_PASSPHRASE: "${OKX_PASSPHRASE:-}"
      BITGET_API_KEY: "${BITGET_API_KEY:-}"
      BITGET_API_SECRET: "${BITGET_API_SECRET:-}"
      BITGET_API_PASSPHRASE: "${BITGET_API_PASSPHRASE:-}"
      MEXC_API_KEY: "${MEXC_API_KEY:-}"
      MEXC_API_SECRET: "${MEXC_API_SECRET:-}"
      KUCOIN_API_KEY: "${KUCOIN_API_KEY:-}"
      KUCOIN_API_SECRET: "${KUCOIN_API_SECRET:-}"
      KUCOIN_API_PASSPHRASE: "${KUCOIN_API_PASSPHRASE:-}"
      GATEIO_API_KEY: "${GATEIO_API_KEY:-}"
      GATEIO_API_SECRET: "${GATEIO_API_SECRET:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      TRADING_MODE: "${TRADING_MODE:-paper}"
      EXCHANGE: "${EXCHANGE:-binance}"
      EXCHANGE_MODE: "${EXCHANGE_MODE:-testnet}"
      EXCHANGE_MARKET_TYPE: "${EXCHANGE_MARKET_TYPE:-spot}"
      LIVE_TRADING_ENABLED: "${LIVE_TRADING_ENABLED:-false}"
      TESTNET_TRADING_ENABLED: "${TESTNET_TRADING_ENABLED:-false}"
      API_AUTH_ENABLED: "${API_AUTH_ENABLED:-false}"
      API_ACCESS_TOKEN: "${API_ACCESS_TOKEN:-}"
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    command: ["sh", "-c", "python -m backend.db.init_db && exec uvicorn backend.main:app --host 0.0.0.0 --port 8000"]

volumes:
  pgdata:
