[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithmic-trading-system"
version = "0.1.0"
description = "Algorithmic trading platform with SMC strategies, paper trading, and guarded live execution"
authors = [{ name = "Your Company", email = "dev@yourcompany.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.38",
    "asyncpg==0.30.0",
    "ccxt==4.2.96",
    "pydantic==2.10.0",
    "pydantic-settings==2.6.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "python-telegram-bot==21.9",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "black==24.10.0",
    "isort==5.13.2",
    "mypy==1.15.0",
    "pre-commit==3.9.1",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
